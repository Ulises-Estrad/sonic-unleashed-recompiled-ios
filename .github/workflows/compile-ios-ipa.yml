name: Compile unsigned Day-Stage Arcade iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compile-ios-ipa
  cancel-in-progress: false

jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      INPUT_TAG: private-build-inputs-v1
      SOURCE_COMMIT: 5d5adbc7e6953990be3184e8614787d93940b713
      SOURCE_REPOSITORY: https://github.com/Markos-Th09/UnleashedRecomp.git
      IPA_NAME: Sonic-Unleashed-Compiled.ipa
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out private build repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ninja

      - name: Download and verify private build inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private-inputs" "$RUNNER_TEMP/userdata/game" "$RUNNER_TEMP/userdata/update"
          gh release download "$INPUT_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'default.xex' \
            --pattern 'default.xexp' \
            --pattern 'shader.ar' \
            --pattern 'private-build-inputs.sha256' \
            --dir "$RUNNER_TEMP/private-inputs"
          cd "$RUNNER_TEMP/private-inputs"
          shasum -a 256 -c private-build-inputs.sha256
          cp default.xex "$RUNNER_TEMP/userdata/game/default.xex"
          cp default.xexp "$RUNNER_TEMP/userdata/update/default.xexp"
          cp shader.ar "$RUNNER_TEMP/userdata/game/shader.ar"

      - name: Clone pinned iOS port and apply arcade patch
        shell: bash
        run: |
          set -euo pipefail
          git clone --recurse-submodules --branch ios "$SOURCE_REPOSITORY" "$RUNNER_TEMP/UnleashedRecomp"
          cd "$RUNNER_TEMP/UnleashedRecomp"
          git checkout "$SOURCE_COMMIT"
          git submodule update --init --recursive
          git apply --check "$GITHUB_WORKSPACE/patches/UnleashedRecomp-iOS-Day-Stage-Arcade.patch"
          git apply "$GITHUB_WORKSPACE/patches/UnleashedRecomp-iOS-Day-Stage-Arcade.patch"

      - name: Compile and verify unsigned device IPA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/UnleashedRecomp"
          GAME_DATA_ROOT="$RUNNER_TEMP/userdata" \
          JOBS="$(sysctl -n hw.logicalcpu)" \
            ./tools/package_ios_ipa.sh
          test -s out/Sonic-Unleashed.ipa
          unzip -tq out/Sonic-Unleashed.ipa
          python3 - <<'PY'
          import plistlib
          import zipfile

          ipa = "out/Sonic-Unleashed.ipa"
          prefix = "Payload/Sonic Unleashed.app/"
          icons = {
              "Icon-20.png", "Icon-20@2x.png", "Icon-20@3x.png",
              "Icon-29.png", "Icon-29@2x.png", "Icon-29@3x.png",
              "Icon-40.png", "Icon-40@2x.png", "Icon-40@3x.png",
              "Icon-60@2x.png", "Icon-60@3x.png", "Icon-76.png",
              "Icon-76@2x.png", "Icon-83.5@2x.png",
          }
          with zipfile.ZipFile(ipa) as archive:
              info = plistlib.loads(archive.read(prefix + "Info.plist"))
              assert info["CFBundleDisplayName"] == "Sonic Unleashed"
              assert info["CFBundleExecutable"] == "Sonic Unleashed"
              assert info["UILaunchScreen"] == {}
              assert info["UIStatusBarHidden"] is True
              assert info["UIViewControllerBasedStatusBarAppearance"] is False
              assert prefix + "Sonic Unleashed" in archive.namelist()
              executable = archive.read(prefix + "Sonic Unleashed")
              markers = (
                  b"iOS startup: entering SDL event pump.",
                  b"SYNC-CS-BACKEND condition-variable-ios",
              )
              missing_markers = [marker.decode() for marker in markers if marker not in executable]
              assert not missing_markers, f"Missing iOS runtime fixes: {missing_markers}"
              missing = sorted(prefix + icon for icon in icons if prefix + icon not in archive.namelist())
              assert not missing, f"Missing app icons: {missing}"
          PY
          mv out/Sonic-Unleashed.ipa "out/$IPA_NAME"
          shasum -a 256 "out/$IPA_NAME" > "out/$IPA_NAME.sha256"

      - name: Publish compiled IPA for local data injection
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="compiled-ios-${GITHUB_RUN_NUMBER}"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Compiled unsigned arm64 iOS app for the private Sonic Unleashed
          Day-Stage Arcade edition. It includes the iPhone Metal launch fix,
          Sonic Unleashed app name and icon, title-to-selector flow, arcade
          gameplay patches, native fullscreen presentation, background/resume
          lifecycle handling, DualSense-style touch controls with Start,
          automatic DualSense/touch handoff, and bundled-data support.

          This intermediate IPA intentionally contains no full game data. The
          owner's local packaging step injects the validated slim data tree and
          produces one standard-ZIP IPA for Sideloadly.
          NOTES
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/UnleashedRecomp/out/$IPA_NAME" \
            "$RUNNER_TEMP/UnleashedRecomp/out/$IPA_NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Compiled Sonic Unleashed iOS IPA" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
